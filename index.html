<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gallery">
    <h1>Image Gallery</h1>

    <!-- Row of 4 thumbnails -->
    <div class="thumbnails">
      <img class="thumb active" src="https://picsum.photos/id/1015/1200/800" alt="River running through a valley">
      <img class="thumb" src="https://picsum.photos/id/1025/1200/800" alt="Pug wrapped in a blanket">
      <img class="thumb" src="https://picsum.photos/id/1039/1200/800" alt="Waterfall in a forest">
      <img class="thumb" src="https://picsum.photos/id/1043/1200/800" alt="Mountain landscape">
    </div>

    <!-- Large display area -->
    <div class="display">
      <img id="main-image" src="https://picsum.photos/id/1015/1200/800" alt="River running through a valley">
      <p id="caption">River running through a valley</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
